<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Outreach — Agence OFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <style>

  html, body { margin: 0; padding: 0; background: #121022; }
  #outreach-os * { box-sizing: border-box; }
  #outreach-os {
    --bg: #121022;
    --surface: #191730;
    --surface-2: #201d3d;
    --surface-3: #2a2650;
    --border: #35315f;
    --text: #F1EFFB;
    --text-dim: #9993C4;
    --text-faint: #605C8F;
    --mint: #3ECF8E;
    --gold: #F0B429;
    --rose: #E8546B;
    --blue: #6C8CFF;
    --pink: #FF4FA0;

    font-family: 'Inter', -apple-system, sans-serif;
    background:
      radial-gradient(ellipse 900px 500px at 12% -10%, rgba(255,79,160,0.10), transparent 60%),
      radial-gradient(ellipse 800px 500px at 100% 0%, rgba(108,140,255,0.10), transparent 55%),
      var(--bg);
    color: var(--text);
    padding: 28px 24px 60px;
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.5;
  }
  #outreach-os .mono { font-family: 'JetBrains Mono', 'SF Mono', monospace; font-variant-numeric: tabular-nums; }
  #outreach-os h1, #outreach-os h2, #outreach-os h3 { font-family: 'Space Grotesk', 'Inter', sans-serif; margin: 0; letter-spacing: -0.01em; }

  /* ---- Header ---- */
  #oo-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 22px; flex-wrap: wrap; gap: 14px; }
  #oo-logo { font-family: 'Space Grotesk', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; margin-bottom: 8px; }
  #oo-logo .crm { color: var(--text); }
  #oo-logo .outreach { background: linear-gradient(90deg, var(--pink), #B06AFF); -webkit-background-clip: text; background-clip: text; color: transparent; margin-left: 6px; }
  #oo-header .eyebrow { color: var(--pink); font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; font-weight: 700; margin-bottom: 6px; }
  #oo-header .sub { color: var(--text-dim); font-size: 13px; margin-top: 4px; }
  #oo-goal-chip { background: linear-gradient(135deg, rgba(255,79,160,0.16), rgba(240,180,41,0.05)); border: 1px solid rgba(255,79,160,0.4); border-radius: 10px; padding: 10px 16px; text-align: right; box-shadow: 0 0 24px rgba(255,79,160,0.12); }
  #oo-goal-chip .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--pink); font-weight: 700; }
  #oo-goal-chip .val { font-size: 20px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; color: var(--pink); }

  /* ---- Tabs ---- */
  #oo-tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 24px; overflow-x: auto; padding-bottom: 2px; }
  #oo-tabs button { background: none; border: 1px solid transparent; color: var(--text-dim); font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; padding: 7px 15px; cursor: pointer; border-radius: 999px; white-space: nowrap; transition: color .15s, border-color .15s, background .15s; margin-bottom: 6px; }
  #oo-tabs button:hover { color: var(--text); }
  #oo-tabs button.active { color: var(--gold); border-color: rgba(240,180,41,0.5); background: rgba(240,180,41,0.08); }

  /* ---- Stat cards ---- */
  #oo-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px,1fr)); gap: 14px; margin-bottom: 28px; }
  .oo-stat { position: relative; background: linear-gradient(160deg, var(--surface-2), var(--surface)); border: 1px solid var(--border); border-radius: 14px; padding: 18px 18px 16px; overflow: hidden; box-shadow: 0 8px 20px -12px rgba(0,0,0,0.5); transition: transform .18s, border-color .18s; }
  .oo-stat::before { content:''; position:absolute; top:0; left:0; right:0; height:2px; background: linear-gradient(90deg, var(--accent, var(--border)), transparent); opacity:.8; }
  .oo-stat:hover { transform: translateY(-2px); border-color: var(--accent, var(--border)); }
  .oo-stat .icon { font-size: 15px; opacity: .85; margin-bottom: 10px; display:block; }
  .oo-stat .lbl { color: var(--text-dim); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.09em; font-weight: 700; margin-bottom: 8px; }
  .oo-stat .val { font-size: 27px; font-weight: 700; font-family: 'Space Grotesk', sans-serif; letter-spacing: -0.01em; }
  .oo-stat .val.mint { color: var(--mint); } .oo-stat .val.gold { color: var(--gold); } .oo-stat .val.rose { color: var(--rose); } .oo-stat .val.pink { color: var(--pink); }
  .oo-stat.acc-mint { --accent: var(--mint); } .oo-stat.acc-gold { --accent: var(--gold); } .oo-stat.acc-pink { --accent: var(--pink); } .oo-stat.acc-blue { --accent: var(--blue); }

  /* ---- Leaderboard (signature element) ---- */
  #oo-leaderboard { position: relative; background: linear-gradient(165deg, var(--surface-2), var(--surface) 60%); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px 24px; margin-bottom: 28px; box-shadow: 0 12px 32px -16px rgba(0,0,0,0.55); overflow: hidden; }
  #oo-leaderboard::after { content:''; position:absolute; top:-60px; right:-60px; width:220px; height:220px; background: radial-gradient(circle, rgba(240,180,41,0.12), transparent 70%); pointer-events:none; }
  #oo-leaderboard .lb-head { display:flex; justify-content: space-between; align-items:baseline; margin-bottom: 4px; }
  #oo-leaderboard h2 { font-size: 15.5px; font-weight: 700; }
  #oo-leaderboard .lb-sub { color: var(--text-dim); font-size: 12px; margin-bottom: 18px; }
  .lb-row { position: relative; display: grid; grid-template-columns: 36px 1fr 110px; gap: 14px; align-items: center; padding: 12px 4px; border-top: 1px solid var(--border); }
  .lb-row:first-of-type { border-top: none; }
  .lb-rank { display:flex; align-items:center; justify-content:center; width:30px; height:30px; border-radius:50%; font-family: 'Space Grotesk', sans-serif; font-weight: 700; color: var(--text-faint); font-size: 12.5px; background: var(--surface-3); border: 1px solid var(--border); }
  .lb-row.rank-1 .lb-rank { color: #1A1508; background: linear-gradient(150deg, #FFDE8A, var(--gold)); border-color: transparent; box-shadow: 0 0 16px rgba(240,180,41,0.5); }
  .lb-row.rank-2 .lb-rank { color: #14141A; background: linear-gradient(150deg, #E4E7EF, #A7ACC0); border-color: transparent; }
  .lb-row.rank-3 .lb-rank { color: #241408; background: linear-gradient(150deg, #E3A970, #B8763B); border-color: transparent; }
  .lb-bar-track { grid-column: 1 / -1; height: 7px; background: var(--surface-3); border-radius: 4px; overflow: hidden; margin-top: 4px; }
  .lb-bar-fill { height: 100%; background: linear-gradient(90deg, var(--pink), var(--gold)); border-radius: 4px; box-shadow: 0 0 10px rgba(255,79,160,0.4); }
  .lb-closes { text-align: right; font-family: 'Space Grotesk', sans-serif; }
  .lb-closes .n { font-size: 18px; font-weight: 700; color: var(--gold); }
  .lb-closes .l { font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: .06em; }
  .lb-name { font-weight: 700; font-size: 14px; }
  .lb-meta { color: var(--text-dim); font-size: 11.5px; margin-top: 3px; }
  #oo-empty-lb { color: var(--text-dim); font-size: 13px; padding: 10px 0 4px; }

  /* ---- Generic panel/card ---- */
  .oo-panel { background: linear-gradient(165deg, var(--surface-2), var(--surface) 65%); border: 1px solid var(--border); border-radius: 16px; padding: 22px 24px; margin-bottom: 20px; box-shadow: 0 10px 26px -18px rgba(0,0,0,0.6); }
  .oo-panel h2 { font-size: 15.5px; font-weight: 700; margin-bottom: 4px; padding-left: 11px; border-left: 3px solid var(--pink); }
  .oo-panel .desc { color: var(--text-dim); font-size: 12.5px; margin-bottom: 16px; padding-left: 11px; }
  .oo-field input, .oo-field select, .oo-field textarea {
    background: var(--surface-3); border: 1px solid var(--border); border-radius: 8px; color: var(--text);
    padding: 9px 10px; font-size: 13.5px; font-family: inherit; outline: none; transition: border-color .15s, box-shadow .15s;
  }
  .oo-field input:focus, .oo-field select:focus, .oo-field textarea:focus { border-color: var(--pink); box-shadow: 0 0 0 3px rgba(255,79,160,0.15); }
  .oo-field textarea { resize: vertical; min-height: 56px; }
  .oo-full { grid-column: 1 / -1; }
  #oo-rating-picker { display: flex; gap: 6px; }
  #oo-rating-picker button { background: var(--surface-2); border: 1px solid var(--border); color: var(--text-faint); border-radius: 6px; width: 34px; height: 34px; cursor: pointer; font-size: 15px; }
  #oo-rating-picker button.active { background: rgba(255,79,160,0.15); border-color: var(--pink); color: var(--pink); }

  .oo-btn { background: linear-gradient(135deg, var(--pink), #FF7A3D); color: #1A0B14; border: none; border-radius: 9px; padding: 10px 18px; font-weight: 700; font-size: 13.5px; font-family: 'Space Grotesk', sans-serif; cursor: pointer; transition: filter .15s, transform .12s; box-shadow: 0 6px 16px -6px rgba(255,79,160,0.45); }
  .oo-btn:hover { filter: brightness(1.08); transform: translateY(-1px); }
  .oo-btn:active { transform: translateY(0); }
  .oo-btn.secondary { background: var(--surface-3); color: var(--text); border: 1px solid var(--border); box-shadow: none; }
  .oo-btn.danger { background: transparent; color: var(--rose); border: 1px solid rgba(232,84,107,0.4); padding: 6px 10px; font-size: 12px; box-shadow: none; }
  .oo-actions-row { margin-top: 16px; display: flex; gap: 10px; }

  /* ---- Chips list (accounts/techniques) ---- */
  .oo-chip-list { display: flex; flex-direction: column; gap: 8px; }
  .oo-chip { display: flex; justify-content: space-between; align-items: center; background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 12px 15px; transition: border-color .15s, background .15s; }
  .oo-chip:hover { border-color: rgba(255,79,160,0.35); background: var(--surface-3); }
  .oo-chip .name { font-weight: 700; font-size: 13.5px; }
  .oo-chip .meta { color: var(--text-dim); font-size: 12px; }

  /* ---- Forms ---- */
  .oo-form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px,1fr)); gap: 12px; }
  .oo-field { display: flex; flex-direction: column; gap: 5px; }
  .oo-field label { font-size: 11px; color: var(--text-dim); font-weight: 600; text-transform: uppercase; letter-spacing: .05em; }

  /* ---- Table ---- */
  table.oo-table { width: 100%; border-collapse: collapse; font-size: 12.8px; }
  table.oo-table th { text-align: left; color: var(--text-dim); font-weight: 600; text-transform: uppercase; font-size: 10.5px; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.oo-table td { padding: 9px 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  table.oo-table tr:last-child td { border-bottom: none; }
  .oo-tag { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10.5px; font-weight: 600; }
  .oo-tag.closed50 { background: rgba(240,180,41,0.15); color: var(--gold); }
  .oo-tag.closed { background: rgba(62,207,142,0.15); color: var(--mint); }
  .oo-tag.lost { background: rgba(232,84,107,0.15); color: var(--rose); }
  .oo-tag.progress { background: rgba(91,141,239,0.15); color: var(--blue); }
  .oo-filters { display: flex; gap: 10px; margin-bottom: 14px; flex-wrap: wrap; }
  .oo-filters select { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 7px 10px; font-size: 12.5px; }

  #oo-empty-state { text-align: center; padding: 40px 20px; color: var(--text-dim); }
  #oo-empty-state .big { font-size: 15px; color: var(--text); font-weight: 600; margin-bottom: 6px; font-family: 'Space Grotesk', sans-serif; }

  /* ---- VA badge ---- */
  .oo-va-badge { display: inline-flex; align-items: center; gap: 5px; background: rgba(91,141,239,0.14); color: var(--blue); border: 1px solid rgba(91,141,239,0.3); border-radius: 20px; padding: 3px 10px; font-size: 11px; font-weight: 600; }
  .oo-chip .accounts-list { margin-top: 6px; display: flex; flex-wrap: wrap; gap: 6px; }
  .oo-mini-tag { background: var(--surface-3); color: var(--text-dim); border-radius: 6px; padding: 2px 8px; font-size: 11px; }

  /* ---- Training videos ---- */
  #oo-training-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px,1fr)); gap: 16px; margin-top: 4px; }
  .oo-train-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .oo-train-video { position: relative; width: 100%; aspect-ratio: 16/9; background: #05060a; }
  .oo-train-video iframe { width: 100%; height: 100%; border: 0; display: block; }
  .oo-train-video .oo-noembed { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; gap:8px; color: var(--text-dim); font-size:12px; padding: 10px; text-align:center; }
  .oo-train-body { padding: 14px 16px 16px; }
  .oo-train-body .cat { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--gold); font-weight: 700; margin-bottom: 4px; }
  .oo-train-body .title { font-weight: 700; font-size: 13.5px; font-family: 'Space Grotesk', sans-serif; margin-bottom: 4px; }
  .oo-train-body .desc { color: var(--text-dim); font-size: 12px; margin-bottom: 10px; }
  .oo-train-body .row-actions { display: flex; justify-content: space-between; align-items: center; }
  .oo-link-btn { color: var(--blue); font-size: 12px; font-weight: 600; text-decoration: none; }
  .oo-script-box { background: var(--surface-3); border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; font-size: 12.5px; color: var(--text-dim); white-space: pre-wrap; margin-top: 8px; }

  /* ---- Comment library ---- */
  #oo-comments-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 12px; }
  .oo-comment-card { background: var(--surface-2); border: 1px solid var(--border); border-radius: 11px; padding: 14px 16px; cursor: pointer; transition: border-color .15s, transform .12s, background .15s; }
  .oo-comment-card:hover { border-color: var(--pink); background: var(--surface-3); transform: translateY(-2px); }
  .oo-comment-text { font-weight: 600; font-size: 13.5px; margin-bottom: 10px; }
  .oo-comment-footer { display: flex; justify-content: space-between; align-items: center; }
  .oo-comment-count { font-size: 11px; color: var(--text-dim); }

  @media (max-width: 560px) {
    #oo-header { flex-direction: column; align-items: flex-start; }
    .lb-row { grid-template-columns: 20px 1fr; }
    .lb-closes { grid-column: 2; justify-self: start; text-align: left; display:flex; gap:6px; align-items:baseline; }
  }

  </style>
</head>

  <div id="outreach-os">

  <script>
// Compatibility shim so the app's existing window.storage.get/set calls
// (originally designed for the Claude.ai artifact storage API) work
// unmodified against a real backend on Netlify.
//
// shared = false -> stored locally in this browser only (used for "who am I logged in as")
// shared = true  -> stored in Netlify Blobs via a serverless function (shared by everyone)
(function () {
  const API = '/.netlify/functions/data';

  async function get(key, shared) {
    if (!shared) {
      try {
        const v = localStorage.getItem(key);
        return v !== null ? { key, value: v, shared } : null;
      } catch (e) {
        return null;
      }
    }
    try {
      const res = await fetch(`${API}?key=${encodeURIComponent(key)}`);
      if (!res.ok) return null;
      const data = await res.json();
      if (!data || data.value === undefined || data.value === null) return null;
      return { key, value: data.value, shared };
    } catch (e) {
      throw e;
    }
  }

  async function set(key, value, shared) {
    if (!shared) {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared };
      } catch (e) {
        return null;
      }
    }
    try {
      const res = await fetch(API, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ key, value }),
      });
      if (!res.ok) return null;
      return { key, value, shared };
    } catch (e) {
      throw e;
    }
  }

  window.storage = { get, set };
})();

  </script>
  <script>

(function(){
  const STORAGE_KEYS = { accounts: 'oo-accounts', techniques: 'oo-techniques', entries: 'oo-entries', vas: 'oo-vas', trainings: 'oo-trainings', comments: 'oo-comments' };
  let state = { accounts: [], techniques: [], entries: [], vas: [], trainings: [], comments: [], identity: null, settings: {}, loaded: false };
  let activeTab = 'dashboard';
  let journalFilters = { technique: 'all', account: 'all', status: 'all', va: 'all' };
  let pendingRating = 3;

  const TABS_ADMIN = [
    { id: 'dashboard', label: 'Dashboard' },
    { id: 'add', label: 'Ajouter une entrée' },
    { id: 'journal', label: 'Journal' },
    { id: 'vaperf', label: 'Vue par VA' },
    { id: 'techniques', label: 'Techniques' },
    { id: 'accounts', label: 'Comptes' },
    { id: 'vas', label: 'VA' },
    { id: 'formation', label: 'Formation' },
    { id: 'comments', label: 'Comments' },
  ];
  const TABS_VA = [
    { id: 'myspace', label: 'Mon espace' },
    { id: 'techniques', label: 'Techniques' },
    { id: 'formation', label: 'Formation' },
    { id: 'comments', label: 'Comments' },
  ];

  function currentTabs(){ return state.identity && state.identity.role === 'va' ? TABS_VA : TABS_ADMIN; }
  function dateStr(offsetDays){ const d = new Date(); d.setDate(d.getDate()+(offsetDays||0)); return d.toISOString().slice(0,10); }

  const PROFILE_TIERS = [
    { id: 'lt5', label: '< 5k€/mois', estValue: 2500 },
    { id: '5-15', label: '5–15k€/mois', estValue: 10000 },
    { id: '15-50', label: '15–50k€/mois', estValue: 32500 },
    { id: 'gte50', label: '50k€+/mois', estValue: 60000 },
    { id: 'unknown', label: 'Potentiel inconnu', estValue: 0 },
  ];
  function tierEstValue(id){ const t = PROFILE_TIERS.find(t=>t.id===id); return t ? t.estValue : 0; }
  const STATUS = [
    { id: 'progress', label: 'En cours' },
    { id: 'closed', label: 'Closé' },
    { id: 'lost', label: 'Perdu' },
  ];

  const $ = sel => document.querySelector(sel);
  const uid = () => Math.random().toString(36).slice(2, 10);
  const genCode = () => Array.from({length:6}, () => 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[Math.floor(Math.random()*33)]).join('');
  const fmtPct = (a,b) => b > 0 ? Math.round((a/b)*1000)/10 : 0;
  const fmtEuro = n => (n||0).toLocaleString('fr-FR');

  async function loadAll(){
    if (typeof window.storage === 'undefined'){
      $('#oo-tabs').style.display = 'none';
      $('#oo-content').innerHTML = `
        <div class="oo-panel" style="max-width:520px;margin:20px auto;text-align:center; border-color:rgba(232,84,107,0.5)">
          <h2 style="border-left-color:var(--rose)">Stockage indisponible</h2>
          <div class="desc" style="padding-left:11px">
            Cet outil ne peut pas sauvegarder ni lire de données ici. C'est le signe que tu l'ouvres comme un fichier téléchargé (file:///…) plutôt que via le lien Claude.ai.<br><br>
            Ouvre l'outil depuis la conversation Claude.ai (ou le lien de partage de l'artefact) pour que les données, le classement et les codes d'accès fonctionnent.
          </div>
        </div>
      `;
      return;
    }
    for (const [key, storageKey] of Object.entries(STORAGE_KEYS)){
      try {
        const res = await window.storage.get(storageKey, true);
        state[key] = res && res.value ? JSON.parse(res.value) : [];
      } catch(e) { state[key] = []; }
    }
    try {
      const idRes = await window.storage.get('oo-identity', false);
      state.identity = idRes && idRes.value ? JSON.parse(idRes.value) : null;
    } catch(e) { state.identity = null; }
    try {
      const sRes = await window.storage.get('oo-settings', true);
      state.settings = sRes && sRes.value ? JSON.parse(sRes.value) : {};
    } catch(e) { state.settings = {}; }
    state.loaded = true;
    render();
  }

  async function persist(key){
    try { await window.storage.set(STORAGE_KEYS[key], JSON.stringify(state[key]), true); }
    catch(e){ console.error('storage error', e); }
  }

  async function persistSettings(){
    try { await window.storage.set('oo-settings', JSON.stringify(state.settings), true); }
    catch(e){ console.error('storage error', e); }
  }

  function buildInviteMailto(va, code){
    const base = state.settings.toolUrl || '[colle ici le lien de l\'outil]';
    const link = state.settings.toolUrl ? `${base}#invite=${code}` : base;
    const subject = `Ton accès à l'outil d'outreach`;

  function vaName(id){ const v = state.vas.find(v=>v.id===id); return v ? v.name : null; }

  function toEmbedUrl(rawUrl){
    try {
      const u = new URL(rawUrl);
      const host = u.hostname.replace('www.','');
      if (host === 'youtube.com' || host === 'm.youtube.com'){
        const id = u.searchParams.get('v');
        if (id) return `https://www.youtube.com/embed/${id}`;
        if (u.pathname.startsWith('/embed/')) return rawUrl;
        if (u.pathname.startsWith('/shorts/')) return `https://www.youtube.com/embed/${u.pathname.split('/')[2]}`;
      }
      if (host === 'youtu.be'){
        const id = u.pathname.slice(1);
        if (id) return `https://www.youtube.com/embed/${id}`;
      }
      if (host === 'loom.com'){
        const parts = u.pathname.split('/').filter(Boolean);
        const id = parts[parts.length-1];
        if (id) return `https://www.loom.com/embed/${id}`;
      }
      if (host === 'drive.google.com'){
        const m = u.pathname.match(/\/d\/([^/]+)/);
        if (m) return `https://drive.google.com/file/d/${m[1]}/preview`;
      }
      if (host === 'vimeo.com'){
        const id = u.pathname.split('/').filter(Boolean).pop();
        if (id) return `https://player.vimeo.com/video/${id}`;
      }
    } catch(e) {}
    return null;
  }

  function stars(n){
    const full = Math.round(Number(n)||0);
    let out = '';
    for (let i=1;i<=5;i++) out += `<span style="color:${i<=full?'var(--pink)':'var(--text-faint)'}">★</span>`;
    return out;
  }

  function computeTechniqueStats(){
    return state.techniques.map(t => {
      const rows = state.entries.filter(e => e.techniqueId === t.id);
      const dm = rows.reduce((s,e)=>s+Number(e.dmSent||0),0);
      const resp = rows.reduce((s,e)=>s+Number(e.responses||0),0);
      const closed = rows.filter(e=>e.status==='closed');
      const closed50 = closed.filter(e=>Number(e.monthlyRevenue||0) >= 50000);
      const rated = rows.filter(e=>Number(e.rating||0)>0);
      const avgRating = rated.length ? (rated.reduce((s,e)=>s+Number(e.rating||0),0) / rated.length) : 0;
      return { technique: t, dm, resp, responseRate: fmtPct(resp, dm), entriesCount: rows.length, closedCount: closed.length, closed50Count: closed50.length, avgRating };
    }).filter(s => s.entriesCount > 0)
      .sort((a,b) => b.closed50Count - a.closed50Count || b.responseRate - a.responseRate);
  }

  function computeGlobalStats(){
    const dm = state.entries.reduce((s,e)=>s+Number(e.dmSent||0),0);
    const resp = state.entries.reduce((s,e)=>s+Number(e.responses||0),0);
    const closed = state.entries.filter(e=>e.status==='closed');
    const closed50 = closed.filter(e=>Number(e.monthlyRevenue||0)>=50000);
    const pipeline = state.entries.filter(e => e.handle && e.status === 'progress');
    const potentialCash = pipeline.reduce((s,e)=>s+tierEstValue(e.profileTier),0);
    const managedRevenue = closed.reduce((s,e)=>s+Number(e.monthlyRevenue||0),0);
    return { dm, resp, responseRate: fmtPct(resp,dm), closedCount: closed.length, closed50Count: closed50.length, potentialCash, managedRevenue, pipelineCount: pipeline.length };
  }

  function computeFollowUps(vaId){
    return state.entries

  }

  function wireFollowUpActions(container, onDone){
    container.querySelectorAll('[data-close]').forEach(b => b.addEventListener('click', () => {
      const form = container.querySelector(`[data-closeform="${b.dataset.close}"]`);
      if (form) form.style.display = 'flex';
    }));
    container.querySelectorAll('[data-confirm-close]').forEach(b => b.addEventListener('click', async () => {
      const id = b.dataset.confirmClose;
      const input = container.querySelector(`[data-revenue-input="${id}"]`);
      const revenue = Number((input && input.value) || 0);
      const entry = state.entries.find(e => e.id === id);
      if (entry){ entry.status = 'closed'; entry.monthlyRevenue = revenue; entry.responses = entry.responses || 1; }
      await persist('entries');
      if (onDone) onDone(); else render();
    }));
    container.querySelectorAll('[data-lost]').forEach(b => b.addEventListener('click', async () => {
      const entry = state.entries.find(e => e.id === b.dataset.lost);
      if (entry) entry.status = 'lost';
      await persist('entries');
      if (onDone) onDone(); else render();
    }));
  }

  function renderJournal(c){
    let rows = state.entries.slice();
    if (journalFilters.technique !== 'all') rows = rows.filter(e=>e.techniqueId===journalFilters.technique);

    if (journalFilters.status !== 'all') rows = rows.filter(e=>e.status===journalFilters.status);
    if (journalFilters.va !== 'all') rows = rows.filter(e=> (e.vaId||'') === journalFilters.va);
    rows.sort((a,b) => (b.date||'').localeCompare(a.date||''));

    const tagFor = e => {
      if (e.status === 'closed' && Number(e.monthlyRevenue||0) >= 50000) return `<span class="oo-tag closed50">Closé 50k+</span>`;
      if (e.status === 'closed') return `<span class="oo-tag closed">Closé</span>`;
      if (e.status === 'lost') return `<span class="oo-tag lost">Perdu</span>`;
      return `<span class="oo-tag progress">En cours</span>`;
    };

    c.innerHTML = `
      <div class="oo-panel">
        <h2>Journal des entrées</h2>
        <div class="desc">${rows.length} entrée${rows.length>1?'s':''} affichée${rows.length>1?'s':''}</div>

          <thead><tr>
            <th>Date</th><th>VA</th><th>Compte</th><th>Technique</th><th>Handle</th><th>Profil visé</th><th>Niche</th>

          </tr></thead>
          <tbody>
            ${rows.map(e => `
              <tr>
                <td class="mono">${e.date||'—'}</td>
                <td>${e.vaId && vaName(e.vaId) ? escapeHtml(vaName(e.vaId)) : '—'}</td>
                <td>${escapeHtml(accountName(e.accountId))}</td>
                <td>${escapeHtml(techniqueName(e.techniqueId))}</td>
                <td>${e.handle ? escapeHtml(e.handle) : '—'}</td>
                <td>${tierLabel(e.profileTier)}</td>
                <td>${escapeHtml(e.niche||'—')}</td>
                <td class="mono">${e.dmSent}</td>
                <td class="mono">${e.responses}</td>

        </table>
        </div>
        `}
      </div>
    `;
    const fT = $('#oo-f-technique'), fA = $('#oo-f-account'), fS = $('#oo-f-status'), fV = $('#oo-f-va');

    if (fV) fV.addEventListener('change', e => { journalFilters.va = e.target.value; renderJournal(c); });
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {

                <div style="display:flex; align-items:center; gap:10px; margin-bottom:10px">
                  <span class="lb-rank" style="width:26px;height:26px;font-size:11.5px;${i===0?'background:linear-gradient(150deg,#FFDE8A,var(--gold));color:#1A1508;border-color:transparent;box-shadow:0 0 12px rgba(240,180,41,0.5);':''}">${i+1}</span>
                  ${i===0 ? `<span class="oo-mini-tag" style="color:var(--pink); border:1px solid var(--pink); background:rgba(255,79,160,0.1)">START HERE</span>` : ''}
                </div>
              </div>
              <div class="oo-train-video">
                ${embed ? `<iframe src="${embed}" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>` : `<div class="oo-noembed">Aperçu non disponible<br><a class="oo-link-btn" href="${t.url}" target="_blank" rel="noopener">Ouvrir la vidéo ↗</a></div>`}
              </div>
              <div class="oo-train-body">
                ${t.category ? `<div class="cat">${escapeHtml(t.category)}</div>` : ''}
                <div class="title">${escapeHtml(t.title)}</div>
                ${t.desc ? `<div class="desc">${escapeHtml(t.desc)}</div>` : ''}
                <div class="row-actions">
                  <a class="oo-link-btn" href="${t.url}" target="_blank" rel="noopener">Ouvrir ↗</a>
                  ${isAdmin ? `<button class="oo-btn danger" data-del="${t.id}">Suppr.</button>` : ''}
                </div>
              </div>
            </div>`;
          }).join('')}
        </div>` : `<div id="oo-empty-state">Aucune vidéo de formation pour l'instant.</div>`}
      </div>
    `;
    if (!isAdmin) return;
    $('#oo-train-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.trainings.push({ id: uid(), title: fd.get('title'), category: fd.get('category')||'', url: fd.get('url'), desc: fd.get('desc')||'', order: Number(fd.get('order')||sorted.length+1) });
      await persist('trainings');
      renderFormation(c);
    });
    c.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', async () => {
      state.trainings = state.trainings.filter(t => t.id !== b.dataset.del);
      await persist('trainings');
      renderFormation(c);
    }));
  }

  function renderMySpace(c){
    const va = state.vas.find(v => v.id === state.identity.vaId);
    if (!va){ c.innerHTML = `<div class="oo-panel"><div id="oo-empty-state">Ton profil VA n'existe plus. Demande à l'admin de te réajouter.</div></div>`; return; }
    const myAccounts = state.accounts.filter(a => a.vaId === va.id);
    const today = dateStr(0), yesterday = dateStr(-1);
    const dmToday = state.entries.filter(e => e.vaId===va.id && e.date===today).reduce((s,e)=>s+Number(e.dmSent||0),0);
    const dmYesterday = state.entries.filter(e => e.vaId===va.id && e.date===yesterday).reduce((s,e)=>s+Number(e.dmSent||0),0);
    const quota = Number(va.quotaPerDay||0);
    const quotaMissed = quota > 0 && dmYesterday < quota;
    const myFollowUps = computeFollowUps(va.id);
    pendingRating = pendingRating || 3;

    c.innerHTML = `
      <div class="oo-panel">
        <h2>${escapeHtml(va.name)}'s workspace</h2>
        <div class="desc">Statut : <b>${escapeHtml(va.status||'Trial')}</b> · Quota : ${quota} DM/jour</div>
        ${quotaMissed ? `<div style="background:rgba(232,84,107,0.12); border:1px solid rgba(232,84,107,0.35); border-radius:10px; padding:10px 14px; color:var(--rose); font-size:13px; font-weight:600; margin-bottom:14px">⚠ Quota non atteint hier — ${dmYesterday}/${quota} DM envoyés.</div>` : ''}
        <div id="oo-stats" style="margin-bottom:0">
          <div class="oo-stat"><span class="icon">✉</span><div class="lbl">DM aujourd'hui</div><div class="val mono">${dmToday}</div></div>
          <div class="oo-stat ${quotaMissed?'':'acc-mint'}"><span class="icon">◷</span><div class="lbl">DM hier</div><div class="val mono ${quotaMissed?'rose':'mint'}">${dmYesterday} / ${quota}</div></div>
          <div class="oo-stat acc-gold"><span class="icon">◆</span><div class="lbl">Follow-ups en attente</div><div class="val mono gold">${myFollowUps.length}</div></div>
        </div>
      </div>

      ${!myAccounts.length ? `<div class="oo-panel"><div id="oo-empty-state">Aucun compte ne t'a encore été assigné. Contacte ton admin.</div></div>` : `
      <div class="oo-panel">
        <h2>Log de la session du jour</h2>
        <div class="desc">Enregistre les DM envoyés aujourd'hui pour un compte et une technique.</div>
        <form id="oo-session-form" class="oo-form-grid">
          <div class="oo-field"><label>Date</label><input type="date" name="date" required value="${today}"></div>
          <div class="oo-field"><label>Compte</label><select name="accountId" required>${myAccounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select></div>
          <div class="oo-field"><label>Technique</label><select name="techniqueId" required>${state.techniques.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}</select></div>
          <div class="oo-field"><label>DM envoyés</label><input type="number" name="dmSent" min="0" required value="0"></div>
          <div class="oo-full"><button type="submit" class="oo-btn">Enregistrer la session</button></div>
        </form>
      </div>

      <div class="oo-panel">
        <h2>Une modèle vient de répondre ?</h2>
        <div class="desc">Ajoute-la à ton suivi — elle apparaîtra dans tes follow-ups et dans le dashboard admin.</div>
        <form id="oo-lead-form" class="oo-form-grid">
          <div class="oo-field"><label>Handle Instagram</label><input type="text" name="handle" required placeholder="model_handle"></div>
          <div class="oo-field"><label>Potentiel estimé</label><select name="profileTier">${PROFILE_TIERS.map(t=>`<option value="${t.id}">${t.label}</option>`).join('')}</select></div>
          <div class="oo-field"><label>Compte</label><select name="accountId" required>${myAccounts.map(a=>`<option value="${a.id}">${escapeHtml(a.name)}</option>`).join('')}</select></div>
          <div class="oo-field"><label>Technique</label><select name="techniqueId" required>${state.techniques.map(t=>`<option value="${t.id}">${escapeHtml(t.name)}</option>`).join('')}</select></div>
          <div class="oo-full"><button type="submit" class="oo-btn">Ajouter au suivi</button></div>
        </form>
      </div>`}

      <div class="oo-panel">
        <h2>Tes modèles à relancer</h2>
        <div class="desc">${myFollowUps.length ? `${myFollowUps.length} en attente.` : `Rien à relancer pour l'instant ✓`}</div>
        <div class="oo-chip-list">${myFollowUps.map(followUpRowHtml).join('')}</div>
      </div>
    `;

    const sf = $('#oo-session-form');
    if (sf) sf.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.entries.unshift({
        id: uid(), date: fd.get('date'), accountId: fd.get('accountId'), techniqueId: fd.get('techniqueId'),
        vaId: va.id, handle: '', type: 'session', profileTier: '', niche: '',
        dmSent: Number(fd.get('dmSent')||0), responses: 0, status: 'progress', monthlyRevenue: 0, rating: 0, notes: '',
      });
      await persist('entries');
      renderMySpace(c);
    });
    const lf = $('#oo-lead-form');
    if (lf) lf.addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      state.entries.unshift({
        id: uid(), date: today, accountId: fd.get('accountId'), techniqueId: fd.get('techniqueId'),
        vaId: va.id, handle: (fd.get('handle')||'').replace(/^@/,''), type: 'lead', profileTier: fd.get('profileTier'), niche: '',
        dmSent: 0, responses: 1, status: 'progress', monthlyRevenue: 0, rating: 0, notes: '',
      });
      await persist('entries');
      renderMySpace(c);
    });
    wireFollowUpActions(c, () => renderMySpace(c));
  }

  function renderVAPerf(c){
    if (!state.vas.length){ c.innerHTML = `<div class="oo-panel"><div id="oo-empty-state">Aucune VA enregistrée pour l'instant.</div></div>`; return; }
    const rows = state.vas.map(v => {
      const es = state.entries.filter(e => e.vaId === v.id);
      const dm = es.reduce((s,e)=>s+Number(e.dmSent||0),0);
      const resp = es.reduce((s,e)=>s+Number(e.responses||0),0);
      const rated = es.filter(e=>Number(e.rating||0)>0);
      const avgRating = rated.length ? rated.reduce((s,e)=>s+Number(e.rating||0),0)/rated.length : 0;
      const closed = es.filter(e=>e.status==='closed');
      const closed50 = closed.filter(e=>Number(e.monthlyRevenue||0)>=50000);
      const byAccount = {};
      es.forEach(e => { const n = accountName(e.accountId); byAccount[n] = (byAccount[n]||0) + Number(e.dmSent||0); });
      return { va: v, dm, resp, responseRate: fmtPct(resp,dm), avgRating, closedCount: closed.length, closed50Count: closed50.length, byAccount };
    }).sort((a,b) => b.closed50Count - a.closed50Count || b.dm - a.dm);

    c.innerHTML = `
      <div class="oo-panel">
        <h2>Performance par VA</h2>
        <div class="desc">DM envoyés, taux de réponse et closes, par VA — toutes techniques et tous comptes confondus.</div>
        <div class="oo-chip-list">
          ${rows.map(r => `
            <div class="oo-chip" style="align-items:flex-start; flex-direction:column; gap:8px">
              <div style="display:flex; justify-content:space-between; width:100%; align-items:flex-start; flex-wrap:wrap; gap:8px">
                <div>
                  <div class="name">${escapeHtml(r.va.name)} <span class="oo-mini-tag">${escapeHtml(r.va.status||'Trial')}</span></div>
                  <div class="meta">${r.dm} DM · ${r.responseRate}% de réponse · note moy. ${r.avgRating.toFixed(1)}/5</div>
                </div>
                <div style="display:flex; gap:14px; text-align:right">
                  <div><div class="mono" style="font-weight:700; font-size:16px">${r.closedCount}</div><div class="meta">closés</div></div>
                  <div><div class="mono" style="font-weight:700; font-size:16px; color:var(--gold)">${r.closed50Count}</div><div class="meta">50k+</div></div>
                </div>
              </div>
              <div class="accounts-list">
                ${Object.keys(r.byAccount).length ? Object.entries(r.byAccount).map(([name,dm]) => `<span class="oo-mini-tag">${escapeHtml(name)}: ${dm} DM</span>`).join('') : `<span class="oo-mini-tag">Aucune activité enregistrée</span>`}
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }

  function renderComments(c){
    const sorted = state.comments.slice().sort((a,b)=> (b.copyCount||0) - (a.copyCount||0));
    c.innerHTML = `
      <div class="oo-panel">
        <h2>Banque de commentaires DM</h2>
        <div class="desc">Un commentaire par post, par compte. Jamais un compliment direct — toujours l'effet que ça a eu sur toi (attention, mémoire, temps). Clique sur un commentaire pour le copier.</div>
        <form id="oo-comment-form" class="oo-form-grid" style="margin-bottom:18px">
          <div class="oo-field oo-full"><label>Ajouter un commentaire</label><input type="text" name="text" required placeholder="ex: lost my train of thought completely"></div>
          <div class="oo-full"><button type="submit" class="oo-btn">+ Ajouter à la bibliothèque</button></div>
        </form>
        ${sorted.length ? `<div id="oo-comments-grid">
          ${sorted.map(cm => `
            <div class="oo-comment-card" data-copy-comment="${cm.id}">
              <div class="oo-comment-text">${escapeHtml(cm.text)}</div>
              <div class="oo-comment-footer">
                <span class="oo-comment-count">📋 copié ${cm.copyCount||0} fois</span>
                <button class="oo-btn danger" data-del-comment="${cm.id}" title="Supprimer">✕</button>
              </div>
            </div>
          `).join('')}
        </div>` : `<div id="oo-empty-state">Aucun commentaire pour l'instant. Ajoute le premier ci-dessus.</div>`}
      </div>
    `;
    $('#oo-comment-form').addEventListener('submit', async e => {
      e.preventDefault();
      const fd = new FormData(e.target);
      const text = (fd.get('text')||'').trim();
      if (!text) return;
      state.comments.unshift({ id: uid(), text, copyCount: 0 });
      await persist('comments');
      renderComments(c);
    });
    c.querySelectorAll('[data-copy-comment]').forEach(card => card.addEventListener('click', async e => {
      if (e.target.closest('[data-del-comment]')) return;
      const id = card.dataset.copyComment;
      const cm = state.comments.find(x => x.id === id);
      if (!cm) return;
      navigator.clipboard && navigator.clipboard.writeText(cm.text).catch(()=>{});
      cm.copyCount = (cm.copyCount||0) + 1;
      await persist('comments');
      renderComments(c);
    }));
    c.querySelectorAll('[data-del-comment]').forEach(b => b.addEventListener('click', async e => {
      e.stopPropagation();
      state.comments = state.comments.filter(x => x.id !== b.dataset.delComment);
      await persist('comments');
      renderComments(c);
    }));
  }

  function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m])); }

  function setTab(tab){
    activeTab = tab;
    render();
  }

  const BACKUP_KEYS = ['accounts','techniques','entries','vas','trainings','comments'];

  function refreshHeaderActions(){
    const isAdmin = state.identity && state.identity.role === 'admin';
    const exportBtn = $('#oo-export-btn'), importBtn = $('#oo-import-btn');
    if (exportBtn) exportBtn.style.display = isAdmin ? 'inline-block' : 'none';
    if (importBtn) importBtn.style.display = isAdmin ? 'inline-block' : 'none';
  }

  $('#oo-export-btn').addEventListener('click', () => {
    const backup = { exportedAt: new Date().toISOString(), settings: state.settings };
    BACKUP_KEYS.forEach(k => { backup[k] = state[k]; });
    const blob = new Blob([JSON.stringify(backup, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `crm-outreach-backup-${dateStr(0)}.json`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });

  $('#oo-import-btn').addEventListener('click', () => $('#oo-import-file').click());
  $('#oo-import-file').addEventListener('change', async e => {
    const file = e.target.files[0];
    if (!file) return;
    if (!confirm('Importer ce fichier remplacera toutes les données actuelles (comptes, techniques, entrées, VA, formation, commentaires). Continuer ?')){
      e.target.value = '';
      return;
    }
    try {
      const text = await file.text();
      const backup = JSON.parse(text);
      for (const k of BACKUP_KEYS){
        if (Array.isArray(backup[k])){ state[k] = backup[k]; await persist(k); }
      }
      if (backup.settings && typeof backup.settings === 'object'){
        state.settings = backup.settings;
        await persistSettings();
      }
      alert('Import terminé.');
      render();
    } catch(err){
      alert('Fichier invalide ou illisible.');
    }
    e.target.value = '';
  });

  loadAll();
})();

  </script>
</body>
</html>
