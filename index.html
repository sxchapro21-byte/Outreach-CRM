<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CRM Outreach — Agence OFM</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="outreach-os">
    <div id="oo-header">
      <div>
        <div id="oo-logo"><span class="crm">CRM</span><span class="outreach">OUTREACH</span></div>
        <div class="sub">Agence OFM — un seul objectif : closer des modèles à 50k€+/mois.</div>
      </div>
      <div style="display:flex; align-items:center; gap:14px; flex-wrap:wrap">
        <button id="oo-export-btn" class="oo-btn secondary" style="padding:8px 14px; font-size:12px">⬇ Export backup</button>
        <button id="oo-import-btn" class="oo-btn secondary" style="padding:8px 14px; font-size:12px">⬆ Import</button>
        <input type="file" id="oo-import-file" accept="application/json" style="display:none">
        <div id="oo-identity-chip"></div>
        <div id="oo-goal-chip">
          <div class="lbl">Closes 50k€+/mois</div>
          <div class="val mono" id="oo-goal-count">0</div>
        </div>
      </div>
    </div>

    <div id="oo-tabs"></div>

    <div id="oo-content"></div>
  </div>

  <script src="storage.js"></script>
  <script src="app.js"></script>
</body>
</html>
